<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Summarizer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>📝 Text Summarizer</h1>
      <p>Quickly condense articles, essays, and documents</p>
    </header>

    <main class="main-content">
      <section class="input-section">
        <label for="inputText">Paste your text:</label>
        <textarea id="inputText" placeholder="Enter or paste your text here..."></textarea>
        <div class="controls">
          <label for="summaryLength">Summary Length:</label>
          <input type="button" id="Short"value="Short" />
            <input type="button" id="Medium"value="Medium" />
            <input type="button" id="Long"value="Large" />
        </div>
      </section>

      <section class="output-section">
        <label for="summary">Summarized Text:</label>
        <textarea id="summary" readonly></textarea>
        <div class="buttons">
          <button id="summarizeBtn">Summarize</button>
          <button id="copyBtn">Copy</button>
          <button id="clearBtn">Clear</button>
        </div>
      </section>
    </main>

    
      <footer>
        <pre>Built for <b>Summarization</b></pre>
      </footer>
      <footer>
        <p>for queries in webpage contact  <a href="https://www.linkedin.com/in/amishsatwik/" target="_blank"><img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/LinkedIn_icon.svg/1024px-LinkedIn_icon.svg.png" height="20" width="20"></a> </p>
      <p> for queries in model contact  <a href="https://www.linkedin.com/in/gokulannam/" target="_main"> <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/8/81/LinkedIn_icon.svg/1024px-LinkedIn_icon.svg.png" height="20" width="20"></a>  </p>
    </footer>
  </div>


  <script>
    const lengthInput = document.getElementById("summaryLength");
    const lengthValue = document.getElementById("lengthValue");
    const clearBtn = document.getElementById("clearBtn");
    const copyBtn = document.getElementById("copyBtn");

    lengthInput.addEventListener("input", () => {
      lengthValue.textContent = `${lengthInput.value}%`;
    });

    clearBtn.addEventListener("click", () => {
      document.getElementById("inputText").value = "";
      document.getElementById("summary").value = "";
    });

    copyBtn.addEventListener("click", () => {
      const summary = document.getElementById("summary");
      summary.select();
      document.execCommand("copy");
      alert("Summary copied to clipboard!");
    });

  </script>
</body>
</html>
